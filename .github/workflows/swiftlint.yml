# Style gate. Runs in the official SwiftLint container on Linux — far
# faster and cheaper than a macOS runner. Rules live in /.swiftlint.yml.

name: SwiftLint

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    container:
      # Pinned: a mutable `latest` would let a SwiftLint release with new
      # default rules break every PR without any change in this repo.
      # Bump deliberately.
      image: ghcr.io/realm/swiftlint:0.59.1
    steps:
      - uses: actions/checkout@v7
      # --strict: warnings fail the job too — without it the gate stays
      # green while violations pile up as annotations nobody reads.
      - run: swiftlint --strict --reporter github-actions-logging
