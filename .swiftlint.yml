included:
  - Minute
  - MinuteTests
  - MinuteUITests

disabled_rules:
  # Long lines are dominated by prompts and user-facing strings that read
  # better unwrapped.
  - line_length
  # SwiftUI view builders routinely exceed the default body-size heuristics.
  - function_body_length
  - type_body_length
  - file_length
  - cyclomatic_complexity
  # Short names like `id`, `x`, `to` are idiomatic in this codebase.
  - identifier_name
  - todo
  # `var x: T? = nil` is required for memberwise-initializer defaults on
  # the summary models — removing the `= nil` breaks call sites.
  - redundant_optional_initialization
  # Multiline literals deliberately keep trailing commas for clean diffs.
  - trailing_comma
  # Would push side-effecting calls (e.g. MeetingStore.delete) into
  # `for … where` headers, hiding mutation.
  - for_where
